app-id: com.materiallauncher.app
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: electron-wrapper
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: material-launcher
    buildsystem: simple
    build-commands:
      - install -D -m 755 apply_extra /app/bin/apply_extra
      - install -D -m 644 com.materiallauncher.app.metainfo.xml /app/share/metainfo/com.materiallauncher.app.metainfo.xml
      - install -D -m 644 com.materiallauncher.app.desktop /app/share/applications/com.materiallauncher.app.desktop
      - install -D -m 644 com.materiallauncher.app.png /app/share/icons/hicolor/512x512/apps/com.materiallauncher.app.png
    sources:
      - type: file
        path: com.materiallauncher.app.metainfo.xml
