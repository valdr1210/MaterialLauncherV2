name: Build Linux Release Assets (Rust / Tauri v2)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            squashfs-tools \
            libfuse2

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-cli
        run: |
          if ! cargo tauri --version >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked
          fi

      - name: Build Linux bundles (deb, rpm, appimage)
        run: |
          NO_STRIP=true cargo tauri build --bundles deb,rpm,appimage

      - name: Package release assets
        run: |
          mkdir -p dist-linux
          cp src-tauri/target/release/bundle/deb/*.deb dist-linux/Material.Launcher-1.4.1-amd64.deb
          cp src-tauri/target/release/bundle/rpm/*.rpm dist-linux/Material.Launcher-1.4.1-x86_64.rpm
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/Material.Launcher-1.4.1-x86_64.AppImage

          mkdir -p dist-tar/Material-Launcher-1.4.1
          cp src-tauri/target/release/material-launcher dist-tar/Material-Launcher-1.4.1/material-launcher
          cp src-tauri/icons/icon.png dist-tar/Material-Launcher-1.4.1/icon.png
          chmod +x dist-tar/Material-Launcher-1.4.1/material-launcher
          tar -czf dist-linux/Material.Launcher-1.4.1-linux-x64.tar.gz -C dist-tar Material-Launcher-1.4.1
          ls -lh dist-linux/

      - name: Upload Linux assets to GitHub Release v1.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.4.1 dist-linux/* --clobber || true
